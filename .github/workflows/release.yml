name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Archive version for a build-only release dry run
        required: false
        default: snapshot
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and audit code-only archives
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          make package VERSION="$RELEASE_VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
          ./scripts/check-release-archives.sh dist
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Go System One $GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS
