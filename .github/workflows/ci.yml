name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Repository checks
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: make check
      - name: Race test product packages
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test -mod=vendor -race ./model/gosystemone ./internal/httpinput ./webui

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.56.1
      - name: Install browser test dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
        run: |
          cd browser
          bun install --frozen-lockfile
          bun x playwright install chromium
      - name: Test embedded playground
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
        run: make browser-test

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [arm64, riscv64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile service
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go build -mod=vendor -o /tmp/go-system-one-${{ matrix.goarch }} ./cmd/go-system-one
