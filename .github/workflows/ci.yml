name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_ROOT: ${{ github.workspace }}/go-system-one
  PROFILE_ROOT: ${{ github.workspace }}/go-system-one/profiles

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Repository checks
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: make check
      - name: Race test product packages
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: ./scripts/test-profile.sh ./model/gosystemone ./internal/httpinput ./webui -- -race

      - name: Retain validation profiles and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/go-system-one/
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go-system-one/cache/playwright
          key: playwright-chromium-${{ runner.os }}-1.56.1
      - name: Install browser test dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/go-system-one/cache/playwright
        run: |
          source scripts/project-env.sh
          cd browser
          bun install --frozen-lockfile
          bun x playwright install chromium
      - name: Test embedded playground
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/go-system-one/cache/playwright
        run: make browser-test

      - name: Retain validation profiles and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/go-system-one/
          if-no-files-found: warn

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [arm64, riscv64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile service
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          source scripts/project-env.sh
          go build -mod=vendor -o "$PROJECT_TMP_ROOT/build/go-system-one-${{ matrix.goarch }}" ./cmd/go-system-one
      - name: Retain validation profiles and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/go-system-one/
          if-no-files-found: warn
