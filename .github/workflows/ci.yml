name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: make fmt-check
      - name: Test vendored source offline
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test -mod=vendor ./...
      - name: Race test product packages
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test -mod=vendor -race ./model/gosystemone ./internal/httpinput ./webui
      - name: Vet
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go vet -mod=vendor ./...
      - name: Build
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go build -mod=vendor ./...
      - name: Check first-party patch whitespace
        run: git diff --check -- . ':(exclude)vendor/**'

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [arm64, riscv64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile service
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go build -mod=vendor -o /tmp/go-system-one-${{ matrix.goarch }} ./cmd/go-system-one
