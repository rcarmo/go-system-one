 ms</text><text x="242" y="235.0" text-anchor="end" font-size="12">Auto tree</text><line x1="343.1" y1="231.0" x2="344.4" y2="231.0" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/><circle class="good" cx="343.2" cy="231.0" r="6"/><text class="muted" x="354.4" y="235.0" font-size="11">97.84 ms</text><text x="242" y="277.0" text-anchor="end" font-size="12">Deep enum</text><line x1="345.7" y1="273.0" x2="350.6" y2="273.0" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/><circle class="good" cx="346.2" cy="273.0" r="6"/><text class="muted" x="360.6" y="277.0" font-size="11">99.25 ms</text><text x="242" y="319.0" text-anchor="end" font-size="12">Cache disabled</text><line x1="539.2" y1="315.0" x2="540.3" y2="315.0" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/><circle class="good" cx="539.8" cy="315.0" r="6"/><text class="muted" x="550.3" y="319.0" font-size="11">252.06 ms</text><text x="242" y="361.0" text-anchor="end" font-size="12">Cache miss</text><line x1="540.3" y1="357.0" x2="544.3" y2="357.0" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/><circle class="good" cx="542.2" cy="357.0" r="6"/><text class="muted" x="554.3" y="361.0" font-size="11">255.03 ms</text><text x="242" y="403.0" text-anchor="end" font-size="12">Four contexts</text><line x1="593.5" y1="399.0" x2="594.7" y2="399.0" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/><circle class="good" cx="594.2" cy="399.0" r="6"/><text class="muted" x="604.7" y="403.0" font-size="11">327.51 ms</text><text x="242" y="445.0" text-anchor="end" font-size="12">Four fields</text><line x1="763.5" y1="441.0" x2="766.3" y2="441.0" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/><circle class="good" cx="764.2" cy="441.0" r="6"/><text class="muted" x="776.3" y="445.0" font-size="11">742.57 ms</text><text x="242" y="487.0" text-anchor="end" font-size="12">Long context</text><line x1="867.7" y1="483.0" x2="869.3" y2="483.0" 